# DeliverIQ local stack (DOCKER_DEPLOYMENT_DESIGN.md). Run through the Makefile, which uses
#   docker compose --project-directory . -f infra/compose.yaml
# so paths below are relative to the repository root and `.env` is read from there.
#
# Profiles: core (postgres, redis, migrate, api), e2e (Task 4B), worker (Task 5).
# osrm (Task 9), demo and agent (Task 15B) are added by the
# tasks that build those services, so no profile starts a container without real code behind it.

name: deliveriq

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-build: &backend-build
  context: .
  dockerfile: infra/backend/Dockerfile
  target: api
  args:
    APP_UID: ${APP_UID:-1000}
    APP_GID: ${APP_GID:-1000}

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:?set APP_ENV in .env}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DB_HOST: postgres
  DB_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
  REDIS_URL: redis://redis:6379/0
  OTP_ADAPTER: ${OTP_ADAPTER:-disabled}
  OTP_PEPPER: ${OTP_PEPPER:?set OTP_PEPPER in .env}
  PSEUDONYM_KEY: ${PSEUDONYM_KEY:?set PSEUDONYM_KEY in .env}
  CORS_ORIGINS: ${CORS_ORIGINS:-}

services:
  postgres:
    profiles: [core]
    build:
      context: infra/postgres
    image: deliveriq-postgres:local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:?}
      APP_API_PASSWORD: ${APP_API_PASSWORD:?}
      WORKER_PASSWORD: ${WORKER_PASSWORD:?set WORKER_PASSWORD in .env}
      P1_SOP_PASSWORD: ${P1_SOP_PASSWORD:?}
      P2_ELT_PASSWORD: ${P2_ELT_PASSWORD:?}
      P3_SYNTH_PASSWORD: ${P3_SYNTH_PASSWORD:?}
      RAG_CUSTOMER_PASSWORD: ${RAG_CUSTOMER_PASSWORD:?}
      RAG_KITCHEN_PASSWORD: ${RAG_KITCHEN_PASSWORD:?}
      RAG_MANAGEMENT_PASSWORD: ${RAG_MANAGEMENT_PASSWORD:?}
    # DDR-62 memory settings.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=20
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # Host port 5433 by default: the owner's host already runs PostgreSQL on 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m
    restart: unless-stopped
    networks: [backend, edge]
    logging: *default-logging

  redis:
    profiles: [core]
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    # DDR-62: 64 MB cap, no persistence (Redis is never a durable queue).
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    mem_limit: 128m
    restart: unless-stopped
    networks: [backend]
    logging: *default-logging

  migrate:
    profiles: [core]
    build: *backend-build
    image: deliveriq-backend:api
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
      DB_USER: app_migrator
      DB_PASSWORD: ${APP_MIGRATOR_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    restart: "no"
    networks: [backend]
    logging: *default-logging

  api:
    profiles: [core]
    build: *backend-build
    image: deliveriq-backend:api
    # Dev: source bind-mounted read-only with --reload (DOCKER_DEPLOYMENT_DESIGN §9).
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000",
              "--workers", "1", "--reload", "--reload-dir", "/srv/backend/app"]
    environment:
      <<: *backend-env
      DB_USER: app_api
      DB_PASSWORD: ${APP_API_PASSWORD:?}
    volumes:
      - ./backend/app:/srv/backend/app:ro
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    restart: unless-stopped
    networks: [backend, edge]
    logging: *default-logging

  # worker profile (Task 5): job queue as the `worker` role; each job connects as its pipeline's own
  # role (DDR-63). Inputs are read-only bind mounts; no Docker socket, no outbound network.
  worker:
    profiles: [worker]
    build:
      <<: *backend-build
      target: worker
    image: deliveriq-backend:worker
    environment:
      <<: *backend-env
      DB_USER: worker
      DB_PASSWORD: ${WORKER_PASSWORD:?set WORKER_PASSWORD in .env}
      P1_SOP_PASSWORD: ${P1_SOP_PASSWORD:?}
      P2_ELT_PASSWORD: ${P2_ELT_PASSWORD:?}
      P3_SYNTH_PASSWORD: ${P3_SYNTH_PASSWORD:?}
      RAG_CUSTOMER_PASSWORD: ${RAG_CUSTOMER_PASSWORD:?}
      RAG_KITCHEN_PASSWORD: ${RAG_KITCHEN_PASSWORD:?}
      RAG_MANAGEMENT_PASSWORD: ${RAG_MANAGEMENT_PASSWORD:?}
      SOURCE_ROOT: /srv/data/source
      INVENTORY_PATH: /srv/docs/SOURCE_DOCUMENT_INVENTORY.md
      TEST_INPUTS_ROOT: /srv/test_inputs
    volumes:
      - ./backend/app:/srv/backend/app:ro
      - ./data/source:/srv/data/source:ro
      - ./docs/SOURCE_DOCUMENT_INVENTORY.md:/srv/docs/SOURCE_DOCUMENT_INVENTORY.md:ro
      - ./backend/test_inputs:/srv/test_inputs:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1200m
    restart: unless-stopped
    networks: [backend]
    logging: *default-logging
  # e2e profile (Task 4B): pinned Playwright image builds and previews the SPA against the api,
  # then runs Chromium suites (axe, screenshots, phone viewports). On demand only (DDR-62).
  e2e:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
    working_dir: /work
    command: ["bash", "/work/tests/e2e/run.sh"]
    environment:
      VITE_API_PROXY: http://api:8000
      E2E_BASE_URL: http://127.0.0.1:4173
      PLAYWRIGHT_ARGS: ${PLAYWRIGHT_ARGS:-}
      CI: ${CI:-}
      HOST_UID: ${APP_UID:-1000}
      HOST_GID: ${APP_GID:-1000}
    volumes:
      - ./frontend:/work/frontend:ro
      - ./tests/e2e:/work/tests/e2e
      - e2e_npm_cache:/tmp/home/.npm
    depends_on:
      api:
        condition: service_healthy
    shm_size: 1gb
    mem_limit: 2g
    restart: "no"
    # backend: reach the api; edge: npm registry for `npm ci` inside the container.
    networks: [backend, edge]
    logging: *default-logging

networks:
  # Internal: no outbound route. Redis and the migrate job live only here.
  backend:
    internal: true
  # Ordinary bridge used only to publish localhost ports (internal networks cannot publish ports).
  edge: {}

volumes:
  pg_data:
  e2e_npm_cache:
